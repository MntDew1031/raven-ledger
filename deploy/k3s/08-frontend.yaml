apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: raven-ledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with an immutable tag or digest from your registry.
          image: docker.io/mntdew1031/raven-ledger-frontend:1.76.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              value: http://backend:8000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: raven-ledger
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
