apiVersion: v1
kind: Secret
metadata:
  name: raven-secrets
  namespace: raven-ledger
type: Opaque
stringData:
  POSTGRES_DB: raven
  POSTGRES_USER: raven
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql+asyncpg://raven:CHANGE_ME@postgres:5432/raven
  SECRET_KEY: CHANGE_TO_A_LONG_RANDOM_VALUE
  ENCRYPTION_KEY: ""
  PLAID_CLIENT_ID: ""
  PLAID_SECRET: ""
