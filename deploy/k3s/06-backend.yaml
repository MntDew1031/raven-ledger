apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: raven-ledger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace with an immutable tag or digest from your registry.
          image: docker.io/mntdew1031/raven-ledger-backend:1.76.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: raven-config
            - secretRef:
                name: raven-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: raven-backups
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: raven-ledger
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
