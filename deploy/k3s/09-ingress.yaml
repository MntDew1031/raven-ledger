apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raven-ledger
  namespace: raven-ledger
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - finance.example.com
      secretName: raven-ledger-tls
  rules:
    - host: finance.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
